# Microfone com cancelamento de ruído — equivalente Linux do efeito
# "Noise removal" do NVIDIA Broadcast.
#
# IMPORTANTE — ESCOPO: este filtro processa SOMENTE A ENTRADA (microfone).
# Nada aqui toca a saída de áudio do sistema (alto-falantes/fones): nenhum
# sink virtual, ganho ou filtro é instalado no caminho de reprodução.
#
# Arquitetura observada no NVIDIA Broadcast 2.3.0 (RELATORIO-LIMPADOR-DE-VOZ.md):
#   microfone real → WASAPI 48 kHz mono → AFX (RNNoise/TensorRT)
#     → driver de áudio virtual nvrtxaudcap64v.dll, que os apps veem como mic.
#
# Equivalente aqui:
#   microfone real → nvclean.input (Audio/Sink, recebe o mic)
#                  → RNNoise 48 kHz mono (LADSPA)
#                  → nvclean (Audio/Source, o microfone que os apps usam)
#
# Convenção do PipeWire para filter-chain (a mesma do source-rnnoise.conf):
#   capture.props  = lado que RECEBE o áudio → expõe-se como Audio/Sink
#   playback.props = lado que ENTREGA o áudio → expõe-se como Audio/Source
#
# Instalação: ./scripts/linux/setup-denoiser.sh
# Controle:   nvclean-control on|off|status|mic|intensity

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "nvclean (microfone sem ruído)"
            media.name       = "nvclean"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "@PLUGIN_PATH@"
                        label  = "nvclean_rnnoise_stereo"
                        control = {
                            # Intensidade 0..1, análoga ao `strength` de
                            # "Noise removal" no Broadcast.
                            # 0 = bypass (mic cru), 1 = filtro ativo.
                            # Alternável em runtime pelo nvclean-control.
                            "Dry/Wet Mix" = 1.0
                        }
                    }
                ]
                inputs  = [ "rnnoise:Input L" "rnnoise:Input R" ]
                outputs = [ "rnnoise:Output L" "rnnoise:Output R" ]
            }
            # Estéreo: o HyperX QuadCast entrega 2 canais. Cada canal é
            # processado por uma instância própria do RNNoise; linkar só um
            # canal num nó mono descartaria metade do sinal.
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "nvclean.input"
                node.description = "nvclean (entrada do microfone)"
                # Audio/Sink: é para cá que o microfone real é ligado.
                media.class      = "Audio/Sink"
                audio.rate       = 48000
                audio.channels   = 2
                audio.position   = [ FL FR ]
                # O link do microfone é refeito automaticamente pelo serviço
                # nvclean-reconnect (systemd --user), que sobrevive a
                # reinícios do PipeWire e à reconexão do dispositivo.
                # node.target não é suficiente aqui: o filter-chain não segue
                # o microfone padrão sozinho (testado).
            }
            playback.props = {
                node.name        = "nvclean"
                node.description = "nvclean (microfone sem ruído)"
                # Audio/Source: é daqui que os apps gravam.
                media.class      = "Audio/Source"
                audio.rate       = 48000
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
        }
    }
]
